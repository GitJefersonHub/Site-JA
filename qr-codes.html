<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>QR Codes Personalizados</title>
  <!-- Bibliotecas para QR Code e PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f9f9f9;
    }

    h2 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .data-hora {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #555;
    }

    .qr-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      justify-content: center;
    }

    .qr-box {
      text-align: center;
      flex: 0 1 120px;
      page-break-inside: avoid;
      break-inside: avoid;
      margin-bottom: 15px;
    }

    .qr-box p {
      font-size: 1rem;
      margin-top: 0.5rem;
      font-weight: bold;
    }

    .btn-exportar {
      display: block;
      margin: 2rem auto;
      padding: 1rem 2rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-exportar:hover {
      background-color: #0056b3;
    }

    /* Cabeçalho e rodapé fixos na impressão */
    @media print {
      body {
        margin: 0;
        padding: 0;
      }

      #conteudoPDF {
        margin: 25mm 10mm 25mm 10mm; /* espaço para cabeçalho e rodapé */
      }

      header, footer {
        position: fixed;
        left: 0;
        right: 0;
        height: 15mm;
        text-align: center;
        font-size: 0.9rem;
        color: #555;
      }

      header {
        top: 0;
      }

      footer {
        bottom: 0;
      }

      .qr-box {
        page-break-inside: avoid;
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <header>
    <h2>QR Codes Personalizados</h2>
  </header>

  <footer>
    <p>Gerado em: <span id="dataHoraPDF"></span></p>
  </footer>

  <!-- Área que será convertida em PDF -->
  <div id="conteudoPDF">
    <div class="qr-container">
      <div class="qr-box"><div id="qr0"></div><p>Abertura</p></div>
      <div class="qr-box"><div id="qr1"></div><p>1° Andar</p></div>
      <div class="qr-box"><div id="qr2"></div><p>2° Andar</p></div>
      <div class="qr-box"><div id="qr3"></div><p>3° Andar</p></div>
      <div class="qr-box"><div id="qr4"></div><p>Portão</p></div>
      <div class="qr-box"><div id="qr5"></div><p>Elevador</p></div>
      <div class="qr-box"><div id="qr6"></div><p>Veículos</p></div>
      <div class="qr-box"><div id="qr7"></div><p>Térreo</p></div>
      <div class="qr-box"><div id="qr8"></div><p>Capela</p></div>
      <div class="qr-box"><div id="qr9"></div><p>Bloco A/B</p></div>
      <div class="qr-box"><div id="qr10"></div><p>A</p></div>
      <div class="qr-box"><div id="qr11"></div><p>B</p></div>
      <div class="qr-box"><div id="qr12"></div><p>C</p></div>
      <div class="qr-box"><div id="qr13"></div><p>D</p></div>
      <div class="qr-box"><div id="qr14"></div><p>E</p></div>
      <div class="qr-box"><div id="qr15"></div><p>F</p></div>
      <div class="qr-box"><div id="qr16"></div><p>G</p></div>
      <div class="qr-box"><div id="qr17"></div><p>H</p></div>
      <div class="qr-box"><div id="qr18"></div><p>I</p></div>
      <div class="qr-box"><div id="qr19"></div><p>J</p></div>
    </div>

    <button class="btn-exportar" onclick="visualizarPDF()">👁️ Visualizar PDF</button>
  </div>

  <script>
    // Lista de códigos que serão convertidos em QR Codes
    const codigos = [
      { id: "qr0", valor: "0" },
      { id: "qr1", valor: "1" },
      { id: "qr2", valor: "2" },
      { id: "qr3", valor: "3" },
      { id: "qr4", valor: "4" },
      { id: "qr5", valor: "5" },
      { id: "qr6", valor: "6" },
      { id: "qr7", valor: "7" },
      { id: "qr8", valor: "8" },
      { id: "qr9", valor: "9" },
      { id: "qr10", valor: "10" },
      { id: "qr11", valor: "11" },
      { id: "qr12", valor: "12" },
      { id: "qr13", valor: "13" },
      { id: "qr14", valor: "14" },
      { id: "qr15", valor: "15" },
      { id: "qr16", valor: "16" },
      { id: "qr17", valor: "17" },
      { id: "qr18", valor: "18" },
      { id: "qr19", valor: "19" }
    ];

    // Gera os QR Codes
    codigos.forEach(c => {
      new QRCode(document.getElementById(c.id), {
        text: c.valor,
        width: 100,
        height: 100
      });
    });

    // Insere data e hora atual no rodapé
    const agora = new Date();
    const formatado = agora.toLocaleString('pt-BR', {
      day: '2-digit',
      month: 'long',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
    document.getElementById("dataHoraPDF").textContent = formatado;

    // Visualiza o PDF em nova aba
    function visualizarPDF() {
      const elemento = document.getElementById("conteudoPDF");

      const opt = {
        margin: [1, 5, 10, 5],
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 1.5 },
        jsPDF: {
          unit: 'mm',
          format: 'a4',
          orientation: 'portrait'
        }
      };

      html2pdf().set(opt).from(elemento).toPdf().get('pdf').then(pdf => {
        const blob = pdf.output('blob');
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      });
    }
  </script>
</body>

</html>
